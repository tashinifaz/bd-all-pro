services:
  - type: web
    name: bd-all-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: PGSSL
        value: "1"
      - key: SEED_DEMO
        value: "1"
